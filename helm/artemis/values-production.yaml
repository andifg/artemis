ingress:
  hostname: mygreendays.de



backup:
  enabled: true
  schedule: '0 5 * * *'
  scheduleName: 'artemis-prod-backup'
  veleroNamespace: velero
  adpStorageLocationName: cloudflare
  monthly:
    scheduleName: 'artemis-prod-backup-monthly'
  # veleroNamespace: openshift-adp

frontend:
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
  image:
    name: ""
    pullPolicy: IfNotPresent

# backend:
#   DatabaseHost: "artemis-postgresql.artemis-prod.svc.cluster.local"

keycloak:
  ingress:
    hostname: auth.mygreendays.de
    extraTls:
      - hosts:
          # Make sure its same as ingress.hostname
          - auth.mygreendays.de
        secretName: keycloak-tls

backend:
  enabled: true
  scheduleName: 'artemis-prod-backup'
