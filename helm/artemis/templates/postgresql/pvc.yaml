kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ .Values.postgresql.primary.persistence.existingClaim }}
  labels:
    {{- include "artemis.labels" . | nindent 4 }}
    {{- if .Values.backup.enabled }}
    backup-pvc-snapshot-to-s3: "true"
    {{- end }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgresql.primary.persistence.size | default "8Gi" }}
