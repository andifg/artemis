apiVersion: velero.io/v1
kind: Backup
metadata:
  namespace: velero
  labels:
    backup-type: manual
  name: manual-meat-meater-dev-backup-2
spec:
  includedNamespaces:
    - meat-meater-dev
  orLabelSelectors:
    - matchExpressions:
        - key: backup-pvc-snapshot-to-s3
          operator: In
          values:
            - "true"
  snapshotMoveData: true
  # for openshift
  # storageLocation: default
  storageLocation: default
