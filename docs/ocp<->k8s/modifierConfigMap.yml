apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-class-modifier
  namespace: velero
data:
  restoreModifier.yml: |-
    version: v1
    resourceModifierRules:
    - conditions:
         groupResource: persistentvolumeclaims
      patches:
      - operation: replace
        path: "/spec/storageClassName"
        value: "rook-cephfs"
